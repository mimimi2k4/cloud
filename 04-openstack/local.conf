[[local|localrc]]
# ============================================================
# DevStack local.conf — VM4 OpenStack all-in-one
# Ubuntu 22.04 | 4 vCPU | 8GB RAM | 60GB disk
# Dùng với: git clone https://opendev.org/openstack/devstack -b stable/2024.1
#
# Đây là bản dùng cho LAB. Đặt mật khẩu của riêng bạn bên dưới,
# đừng dùng mật khẩu trùng với tài khoản thật.
# ============================================================

# IP của VM4 (xem bằng: ip -4 addr show ens33). Nếu VM chỉ có 1 NIC,
# có thể xoá dòng này để DevStack tự phát hiện.
HOST_IP=<IP_CỦA_VM4>

ADMIN_PASSWORD=<đặt_mật_khẩu_lab>
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

# ── Dịch vụ ───────────────────────────────────────────────────
# Keystone, Glance, Nova, Placement, Neutron, Cinder, Horizon đã được
# DevStack bật MẶC ĐỊNH. Từ bản 2023.1 trở đi, Neutron mặc định dùng OVN,
# nên KHÔNG bật các service kiểu OVS cũ (q-agt, q-dhcp, q-l3, q-meta):
# chúng xung đột với OVN và hay làm stack.sh lỗi.

# Tắt dịch vụ không cần để tiết kiệm RAM
disable_service tempest
disable_service swift

# ── Mạng ──────────────────────────────────────────────────────
# Dải IP cho network "public" (nơi lấy floating IP)
FLOATING_RANGE=192.168.200.0/24
PUBLIC_NETWORK_GATEWAY=192.168.200.1
Q_FLOATING_ALLOCATION_POOL=start=192.168.200.200,end=192.168.200.250
# Dải IP cho network "private" (fixed IP)
IPV4_ADDRS_SAFE_TO_USE=10.11.12.0/24

# ── Ảo hoá ────────────────────────────────────────────────────
# Chạy trong VMware cần bật "Virtualize Intel VT-x/EPT" cho VM4.
# Nếu vẫn lỗi KVM, bỏ comment dòng dưới để dùng QEMU (chậm hơn nhưng chạy được):
# LIBVIRT_TYPE=qemu

# ── Log ───────────────────────────────────────────────────────
VERBOSE=True
LOG_COLOR=True
LOGFILE=/opt/stack/logs/stack.sh.log
LOGDAYS=2
