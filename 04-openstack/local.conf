[[local|localrc]]
# ============================================================
# DevStack local.conf — VM4 OpenStack all-in-one
# Ubuntu 22.04 | 4 vCPU | 8GB RAM | 60GB disk
# ============================================================

HOST_IP=<IP_CỦA_VM4>          # thay bằng IP thực của VM4
ADMIN_PASSWORD=StrongPass123
DATABASE_PASSWORD=StrongPass123
RABBIT_PASSWORD=StrongPass123
SERVICE_PASSWORD=StrongPass123

# Các service cơ bản cần cài
enable_service key
enable_service nova
enable_service neutron
enable_service glance
enable_service cinder
enable_service horizon

# Neutron (network)
enable_service q-svc
enable_service q-agt
enable_service q-dhcp
enable_service q-l3
enable_service q-meta
enable_service neutron

# Bật logging chi tiết để debug
VERBOSE=True
LOG_COLOR=True
LOGFILE=/opt/stack/logs/stack.sh.log
LOGDAYS=2

# Tắt các service không cần thiết để tiết kiệm RAM
disable_service tempest
disable_service swift
