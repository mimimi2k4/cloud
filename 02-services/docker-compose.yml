version: '3.8'

services:
  web1:
    image: nginx:alpine
    container_name: web1
    ports:
      - "3001:80"
    volumes:
      - ./html/web1:/usr/share/nginx/html:ro
    restart: unless-stopped

  web2:
    image: nginx:alpine
    container_name: web2
    ports:
      - "3002:80"
    volumes:
      - ./html/web2:/usr/share/nginx/html:ro
    restart: unless-stopped

  web3:
    image: nginx:alpine
    container_name: web3
    ports:
      - "3003:80"
    volumes:
      - ./html/web3:/usr/share/nginx/html:ro
    restart: unless-stopped
