services:
  web1:
    image: nginx:alpine
    container_name: web1
    ports:
      - "3001:80"
    volumes:
      - ./html/web1:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

  web2:
    image: nginx:alpine
    container_name: web2
    ports:
      - "3002:80"
    volumes:
      - ./html/web2:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

  web3:
    image: nginx:alpine
    container_name: web3
    ports:
      - "3003:80"
