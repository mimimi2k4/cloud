upstream web_backend {
    # Round Robin load balancing (default)
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;

    # Health check — remove backend if it fails 3 times in 30s
    # (requires nginx Plus for active health check; passive is built-in)
}

server {
    listen 80;
    server_name web.lab.local _;

    access_log /var/log/nginx/lb-access.log;
    error_log  /var/log/nginx/lb-error.log;

    location / {
        proxy_pass         http://web_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Passive health check: skip unavailable backends
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }
}
