# ============================================================
# dnsmasq config — VM1 Gateway
# Provides DHCP + DNS for LAN (10.10.10.0/24) and DMZ (10.10.20.0/24)
# ============================================================

# Only listen on LAN and DMZ interfaces (not WAN)
interface=ens36
interface=ens38
bind-interfaces

# ── DNS ──────────────────────────────────────────────────────
# Upstream DNS servers
server=8.8.8.8
server=1.1.1.1

# Internal domain
domain=lab.local
local=/lab.local/

# Internal A records
address=/gateway.lab.local/10.10.10.1
address=/vm1.lab.local/10.10.10.1
address=/monitoring.lab.local/10.10.10.10
address=/vm3.lab.local/10.10.10.10
address=/web.lab.local/10.10.20.10
address=/vm2.lab.local/10.10.20.10

# ── DHCP for LAN (vmnet2) ────────────────────────────────────
dhcp-range=ens36,10.10.10.100,10.10.10.200,255.255.255.0,12h
dhcp-option=ens36,3,10.10.10.1      # default gateway
dhcp-option=ens36,6,10.10.10.1      # DNS server

# ── DHCP for DMZ (vmnet3) ────────────────────────────────────
dhcp-range=ens38,10.10.20.100,10.10.20.200,255.255.255.0,12h
dhcp-option=ens38,3,10.10.20.1      # default gateway
dhcp-option=ens38,6,10.10.20.1      # DNS server

# Lease file
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Logging (useful for debugging)
log-queries
log-facility=/var/log/dnsmasq.log
