# ============================================================
# SSH hardening — VM1/VM2/VM3
# Cài đặt:
#   sudo cp sshd_hardening.conf /etc/ssh/sshd_config.d/00-hardening.conf
#   sudo sshd -t && sudo systemctl restart ssh
#
# LƯU Ý: tên file bắt đầu bằng "00-" có chủ đích. OpenSSH dùng giá trị
# ĐẦU TIÊN gặp được cho mỗi tùy chọn, và các file trong sshd_config.d/ được
# đọc theo thứ tự chữ cái. Nếu đặt tên "99-..." thì một file như
# 50-cloud-init.conf (PasswordAuthentication yes) sẽ thắng.
#
# AN TOÀN: trước khi áp dụng, mở một terminal MỚI và test đăng nhập bằng key.
# Đừng đóng session SSH đang mở cho tới khi test xong.
# ============================================================

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers sysadmin
LoginGraceTime 30
MaxAuthTries 3
X11Forwarding no
